<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pista">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Pista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#0C0D0C; --surface:#161816; --surface-2:#212421; --ink:#EEF2EE; --muted:#9AA39B; --line:#2B302B;
    --primary:#4ADE80; --primary-soft:#142A1C; --accent:#B6F24A; --accent-2:#10B981; --accent-soft:#222C12; --ok:#7CF0A8;
    --on-primary:#0C0D0C; --on-accent:#0C0D0C; --glow-a:rgba(182,242,74,.35); --glow-p:rgba(74,222,128,.35);
    --shadow:0 0 0 1px rgba(255,255,255,.04), 0 12px 30px -16px rgba(0,0,0,.85);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D0C; --surface:#161816; --surface-2:#212421; --ink:#EEF2EE; --muted:#9AA39B; --line:#2B302B;
    --primary:#4ADE80; --primary-soft:#142A1C; --accent:#B6F24A; --accent-2:#10B981; --accent-soft:#222C12; --ok:#7CF0A8;
    --on-primary:#0C0D0C; --on-accent:#0C0D0C; --glow-a:rgba(182,242,74,.35); --glow-p:rgba(74,222,128,.35);
    --shadow:0 0 0 1px rgba(255,255,255,.04), 0 12px 30px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
    --bg:#0C0D0C; --surface:#161816; --surface-2:#212421; --ink:#EEF2EE; --muted:#9AA39B; --line:#2B302B;
    --primary:#4ADE80; --primary-soft:#142A1C; --accent:#B6F24A; --accent-2:#10B981; --accent-soft:#222C12; --ok:#7CF0A8;
    --on-primary:#0C0D0C; --on-accent:#0C0D0C; --glow-a:rgba(182,242,74,.35); --glow-p:rgba(74,222,128,.35);
    --shadow:0 0 0 1px rgba(255,255,255,.04), 0 12px 30px -16px rgba(0,0,0,.85);
}
:root[data-theme="light"]{
    --bg:#F3F5F3; --surface:#FFFFFF; --surface-2:#EAEEEA; --ink:#111411; --muted:#5D665E; --line:#DCE2DC;
    --primary:#15803D; --primary-soft:#DCF3E4; --accent:#4D7C0F; --accent-2:#047857; --accent-soft:#ECF5DA; --ok:#15803D;
    --on-primary:#FFFFFF; --on-accent:#FFFFFF; --glow-a:rgba(77,124,15,.18); --glow-p:rgba(21,128,61,.18);
    --shadow:0 1px 0 rgba(17,20,17,.04), 0 10px 26px -14px rgba(17,40,20,.2);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 110px}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
h2{font-size:1.45rem;font-weight:700;margin:32px 0 10px;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:650;margin:0 0 4px;letter-spacing:-.005em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Hero: la cuenta regresiva con el degradado es la única pieza llamativa */
.hero{padding:22px 4px 18px}
.hero .big{display:inline-block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(5rem,26vw,9.5rem);line-height:.8;letter-spacing:-.045em;
  background:linear-gradient(100deg,var(--accent-2) 0%,var(--primary) 50%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em;filter:drop-shadow(0 0 18px var(--glow-a))}
.hero .lbl{font-size:1.05rem;font-weight:600;margin-top:6px}
.hero .when{color:var(--muted);font-size:.95rem}
.track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px}
.track::before,.track .fill{content:"";position:absolute;top:7px;left:12.5%;height:3px;border-radius:3px}
.track::before{right:12.5%;background:var(--line)}
.track .fill{background:linear-gradient(90deg,var(--primary),var(--accent));box-shadow:0 0 10px var(--glow-a)}
.stop{position:relative;text-align:center;font-size:.8rem;color:var(--muted)}
.stop .dot{width:17px;height:17px;border-radius:50%;margin:0 auto 6px;background:var(--bg);border:3px solid var(--line)}
.stop.done .dot{background:var(--primary);border-color:var(--primary);box-shadow:0 0 10px var(--glow-p)}
.stop.next .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft),0 0 18px var(--glow-a)}
.stop.next{color:var(--ink);font-weight:650}
.stop b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:.95rem}

nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 20px));
  background:var(--surface);border:1px solid var(--line);border-radius:999px;display:flex;padding:5px;gap:2px;z-index:5;box-shadow:var(--shadow)}
nav.tabs button{flex:1;background:none;border:0;border-radius:999px;padding:10px 4px;font:600 .92rem Figtree,system-ui,sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--primary);color:var(--on-primary);box-shadow:0 0 16px var(--glow-p)}

.card{background:var(--surface);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.today-plan{background:linear-gradient(135deg,var(--accent-soft),var(--primary-soft));box-shadow:0 0 0 1px var(--line);border-radius:22px;padding:18px}
.today-plan h3{font-size:1.5rem;font-weight:750;letter-spacing:-.02em}
.today-plan.fest{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent),0 0 24px -6px var(--glow-a)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > label{flex:1;min-width:120px}
label{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;font:500 1rem Figtree,system-ui,sans-serif;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;margin-top:4px;min-height:46px}
.today-plan input,.today-plan select{background:var(--surface)}
input::placeholder{color:var(--muted);opacity:.55}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 12px -2px var(--glow-p)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
button.primary{background:var(--accent);box-shadow:0 0 22px -4px var(--glow-a);color:var(--on-accent);border:0;border-radius:14px;padding:14px 18px;font:700 1.05rem Figtree,system-ui,sans-serif;cursor:pointer;width:100%;margin-top:14px}
button.primary:active{transform:translateY(1px)}
button.ghost{background:none;border:0;border-radius:10px;padding:8px 4px;color:var(--primary);font:600 .92rem Figtree,system-ui,sans-serif;cursor:pointer}
button.link{background:var(--primary-soft);border:0;border-radius:999px;color:var(--primary);font:600 .85rem Figtree,system-ui,sans-serif;cursor:pointer;padding:6px 12px}
button.x{background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:8px;border-radius:8px}
button.x:hover{color:var(--accent)}

.ex{counter-increment:ex}
#view{counter-reset:ex}
.ex h3{display:flex;gap:10px;align-items:baseline}
.ex h3::before{content:counter(ex);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;color:var(--accent);font-size:1.1rem;min-width:1ch}
.last{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 36px;gap:8px;align-items:center;margin:6px 0}
.set .n{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;color:var(--muted);text-align:center}
.set input{margin:0;text-align:center;font-weight:650;font-size:1.05rem}
.check{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:1rem;font-weight:500;color:var(--ink);cursor:pointer}
.card.check{padding:14px 16px}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;min-height:0;margin:0;padding:0;border-radius:8px;background:var(--surface-2);border:2px solid var(--line);flex:none;display:grid;place-content:center;cursor:pointer}
.check input:checked{background:var(--primary);border-color:var(--primary);box-shadow:0 0 10px var(--glow-p)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-primary);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pill{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700}
.pill.pink{background:var(--accent-soft);color:var(--accent)}

.table-wrap{overflow-x:auto;background:var(--surface);border-radius:18px;padding:4px 14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:11px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600;font-size:.8rem}
td.num,th.num{text-align:right;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.02rem;font-weight:600}
.up{color:var(--ok);font-weight:700}

.chart{width:100%;height:auto;display:block;background:var(--surface);border-radius:18px;padding:10px 6px;box-shadow:var(--shadow)}
.chart text{font:600 19px Figtree,system-ui,sans-serif;fill:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 4px}
.stat{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .v{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.stat .k{font-size:.8rem;color:var(--muted);margin-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sync{font-size:.78rem;color:var(--muted);margin-top:8px;text-align:center}
ul.plain{margin:0;padding:14px 16px 14px 34px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.card ul.plain{padding:4px 0 0 18px;background:none;box-shadow:none}
ul.plain li{margin:6px 0}
ul.plain li::marker{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <main id="view"></main>
</div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="hoy" aria-selected="true">Hoy</button>
  <button role="tab" data-tab="cuerpo" aria-selected="false">Peso y pasos</button>
  <button role="tab" data-tab="historial" aria-selected="false">Historial</button>
  <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Datos fijos del plan ---------- */
const FESTS = ["2026-10-31","2026-11-15","2026-11-30","2026-12-15"];
const ROUTINES = {
  push:{name:"Push",kind:"fuerza",ex:["Press con mancuernas en banco plano","Press inclinado en máquina","Press de hombro en máquina","Elevaciones laterales","Extensión de tríceps en polea"],cardio:"15–20 min de caminadora inclinada al final"},
  pull:{name:"Pull",kind:"fuerza",ex:["Jalón al pecho","Remo sentado en polea","Remo con mancuerna a una mano","Face pull","Curl de bíceps"],cardio:"15–20 min de caminadora inclinada al final"},
  legs:{name:"Legs",kind:"fuerza",ex:["Prensa de piernas","Sentadilla goblet","Hip thrust","Curl femoral en máquina","Extensión de cuádriceps","Elevación de talones"],cardio:"La vuelta caminando a casa ya cuenta"},
  z2:{name:"Cardio zona 2",kind:"cardio",hint:"35–45 min a ritmo en el que puedas hablar en frases cortas"},
  intervals:{name:"Intervalos",kind:"cardio",hint:"Escaladora o bici: 30 s fuerte / 90 s suave, 6–8 rondas"},
  walk:{name:"Caminata larga",kind:"cardio",hint:"90–120 min. Ej.: ir a Arkadia y volver por la Unidad Deportiva Belén Rincón"},
  recovery:{name:"Recuperación",kind:"cardio",hint:"Solo caminar suave y movilidad"},
  rest:{name:"Descanso",kind:"descanso",hint:"Descanso total. Igual suma pasos si puedes"},
  fest:{name:"Festival",kind:"festival",hint:"Come bien 2–3 h antes, agua con electrolitos, tenis con amortiguación"}
};
const CORE = ["Dead bug · 8 por lado","Bird dog · 8 por lado, 2 s arriba","Plancha lateral · 20–30 s por lado"];
const STRETCH = ["Gato-camello · 10 lentas","Flexor de cadera en zancada · 30 s por lado","Glúteo figura 4 · 30 s por lado","Isquios con toalla · 30 s por lado","Pecho en marco de puerta · 30 s"];

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const todayISO = () => iso(new Date());
const DOW = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const pretty = s => { const d=parse(s); return DOW[d.getDay()]+" "+d.getDate()+" "+MES[d.getMonth()]; };
const short = s => { const d=parse(s); return d.getDate()+" "+MES[d.getMonth()]; };

function nextFest(from){ return FESTS.find(f => f >= from) || null; }
function lastFestBefore(from){ return [...FESTS].reverse().find(f => f < from) || null; }

function planFor(s){
  if (FESTS.includes(s)) return {type:"fest",note:"Hoy se baila."};
  const prev = lastFestBefore(s);
  if (prev){ const since = diffDays(prev,s); if (since>=1 && since<=2) return {type:"recovery",note:"Día "+since+" después del festival: solo caminar y movilidad."}; }
  const dow = parse(s).getDay();
  let type;
  if (s < "2026-10-05") type = {2:"push",3:"z2",4:"pull",5:"legs",6:"walk",0:"rest",1:"rest"}[dow];
  else type = {1:"legs",2:"z2",3:"push",4:"intervals",5:"pull",6:"walk",0:"rest"}[dow];
  const nf = nextFest(s); let note = "";
  if (nf){
    const until = diffDays(s,nf);
    if (until<=2){ type = until===1 ? "rest" : (ROUTINES[type].kind==="fuerza" ? "pull" : "recovery");
      note = until===1 ? "Mañana es festival: descansa, come bien y duerme." : "Faltan 2 días: algo ligero, nada de piernas."; }
    else if (until<=6){ if (type==="intervals") type="recovery";
      note = "Semana de festival: mitad de series y lejos del fallo."; }
  }
  if (!note && prev && diffDays(prev,s)===3 && type==="legs") { type="push"; note="Vuelves después del festival: empieza por Push, Legs cuando no tengas las piernas cargadas."; }
  return {type,note};
}
const defaultSets = s => s < "2026-10-06" ? 2 : 3;

/* ---------- Estado y guardado ---------- */
let state = {sessions:[],body:[],updatedAt:0};
const LS_KEY = "pista-tracker-v1", CFG_KEY = "pista-sync-v1";
const clone = o => JSON.parse(JSON.stringify(o));
function normalize(s){ return {sessions:Array.isArray(s&&s.sessions)?s.sessions:[], body:Array.isArray(s&&s.body)?s.body:[], updatedAt:(s&&s.updatedAt)||0}; }
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ toast("No hay espacio para guardar en el celular"); } }
let cfg = (()=>{ try{ return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }catch(e){ return {}; } })();
function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){} }
const hora = () => new Date().toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
let syncMsg = cfg.url ? "Conectando con Google Sheets…" : "Guardado en este celular";
function setSync(m){ syncMsg = m; document.querySelectorAll(".sync").forEach(el => el.textContent = m); }

async function callSheets(body){
  let j;
  try {
    const r = await fetch(cfg.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({token:cfg.token, ...body})});
    j = await r.json();
  } catch(e) { throw new Error("no respondió. Revisa la URL y que el acceso sea «Cualquier persona»"); }
  if (!j.ok) throw new Error(j.error === "token" ? "La clave no coincide con la del script" : (j.error || "Error en el script"));
  return j;
}
let saveTimer = null;
function persist(){
  state.updatedAt = Date.now();
  saveLocal();
  if (!cfg.url) { setSync("Guardado en este celular"); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 800);
}
async function pushRemote(){
  if (!cfg.url) return;
  try { await callSheets({action:"save", state}); setSync("Sincronizado con Google Sheets · " + hora()); }
  catch(e){ setSync(navigator.onLine ? "Sheets: " + e.message + ". Quedó guardado en el celular." : "Sin internet: guardado en el celular, se sube al volver"); }
}
async function pullRemote(){
  if (!cfg.url) return;
  try{
    const j = await callSheets({action:"load"});
    const remote = j.state ? normalize(j.state) : null;
    if (remote && remote.updatedAt > (state.updatedAt||0)) { state = remote; saveLocal(); render(); setSync("Sincronizado con Google Sheets · " + hora()); }
    else if (!remote || (state.updatedAt||0) > remote.updatedAt) await pushRemote();
    else setSync("Sincronizado con Google Sheets · " + hora());
  }catch(e){ setSync(navigator.onLine ? "Sheets: " + e.message : "Sin internet: usando lo guardado en el celular"); }
}
window.addEventListener("online", () => { if (cfg.url) pullRemote(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cfg.url) pullRemote(); });

/* ---------- Respaldo y sincronización ---------- */
function renderDataSection(){
  return `<h2>Respaldo y sincronización</h2>
  <div class="card">
    <h3>Google Sheets</h3>
    <p class="small muted">Pega la URL de tu Apps Script y la clave que pusiste en TOKEN. Tus datos se suben a tu hoja cada vez que guardas.</p>
    <label>URL del script<input id="cfg-url" inputmode="url" autocomplete="off" value="${esc(cfg.url||"")}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label style="margin-top:8px">Clave (TOKEN)<input id="cfg-token" type="password" autocomplete="off" value="${esc(cfg.token||"")}"></label>
    <button class="primary" id="cfg-save">${cfg.url?"Guardar y sincronizar":"Conectar"}</button>
    ${cfg.url?`<p style="margin-top:10px"><button class="ghost" id="cfg-off">Desconectar Sheets</button></p>`:""}
    <div class="sync">${esc(syncMsg)}</div>
  </div>
  <div class="card">
    <h3>Respaldo manual</h3>
    <p class="small muted">Exporta un archivo con todo, o importa el respaldo que descargaste del tracker de Claude.</p>
    <button class="primary" id="export-json">Exportar respaldo</button>
    <label style="margin-top:12px">Importar respaldo (.json)<input type="file" id="import-file" accept="application/json,.json"></label>
  </div>`;
}
function handleExtraClick(el){
  if (el.id==="cfg-save"){
    const url=document.getElementById("cfg-url").value.trim(), token=document.getElementById("cfg-token").value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { toast("La URL debe terminar en /exec"); return true; }
    if (!token) { toast("Falta la clave"); return true; }
    cfg={url,token}; saveCfg(); setSync("Conectando con Google Sheets…"); render(); pullRemote(); return true;
  }
  if (el.id==="cfg-off"){ if(!confirm("¿Desconectar Google Sheets? Tus datos siguen en el celular y en la hoja.")) return true; cfg={}; saveCfg(); setSync("Guardado en este celular"); render(); return true; }
  if (el.id==="export-json"){
    const json=JSON.stringify({app:"pista",version:1,exportedAt:new Date().toISOString(),state},null,1);
    const file=new File([json],"pista-respaldo-"+todayISO()+".json",{type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file],title:"Respaldo Pista"}).catch(()=>{});
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
    return true;
  }
  return false;
}
document.addEventListener("change", async e => {
  if (e.target.id!=="import-file" || !e.target.files[0]) return;
  try{
    const data=JSON.parse(await e.target.files[0].text());
    const incoming=normalize(data.state||data);
    if (!incoming.sessions.length && !incoming.body.length) throw new Error("vacío");
    const mode = (state.sessions.length||state.body.length) ? (confirm("Ya tienes datos aquí. Aceptar = combinar con el respaldo. Cancelar = reemplazar todo por el respaldo.") ? "merge" : "replace") : "replace";
    if (mode==="replace") state={...incoming};
    else {
      const ses=new Map(state.sessions.map(s=>[s.id,s])); incoming.sessions.forEach(s=>{ if(!ses.has(s.id)) ses.set(s.id,s); });
      const bod=new Map(state.body.map(b=>[b.date,b])); incoming.body.forEach(b=>{ if(!bod.has(b.date)) bod.set(b.date,b); });
      state.sessions=[...ses.values()]; state.body=[...bod.values()];
    }
    persist(); render(); toast("Respaldo importado: "+state.sessions.length+" sesiones, "+state.body.length+" registros");
  }catch(err){ toast("Ese archivo no es un respaldo válido de Pista"); }
  e.target.value="";
});

/* ---------- Utilidades UI ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : null; };

let tab = "hoy";
let draft = null;

function lastSessionWith(exName, beforeDate){
  const list = state.sessions.filter(s => s.date < beforeDate && s.exercises && s.exercises.some(e => e.name===exName && e.sets.some(x => x.kg!=null || x.reps!=null)));
  list.sort((a,b)=> a.date<b.date?1:-1);
  if (!list.length) return null;
  const e = list[0].exercises.find(e => e.name===exName);
  return {date:list[0].date, sets:e.sets.filter(x => x.kg!=null || x.reps!=null)};
}
function newDraft(date,type){
  const found = state.sessions.find(s => s.date===date && s.type===type);
  if (found) return clone(found);
  const r = ROUTINES[type]; const n = defaultSets(date);
  return {id:date+"_"+type, date, type, walked:false, cardioMin:"", coreDone:[], stretchDone:false, notes:"",
    exercises: r.kind==="fuerza" ? r.ex.map(name => ({name, sets:Array.from({length:n},()=>({kg:null,reps:null}))})) : []};
}

/* ---------- Hero ---------- */
function renderHero(){
  const t = todayISO(); const nf = nextFest(t);
  let big, lbl, when = "";
  if (!nf){ big="✓"; lbl="Temporada de festivales completa"; }
  else { const d = diffDays(t,nf); big = d===0 ? "Hoy" : d; lbl = d===0 ? "Festival hoy, a bailar" : (d===1?"día para el próximo festival":"días para el próximo festival"); when = d===0 ? "" : pretty(nf); }
  const done = FESTS.filter(f=>f<t).length;
  const idx = nf ? FESTS.indexOf(nf) : FESTS.length-1;
  let frac = 0;
  if (nf && idx>0){ const prev=FESTS[idx-1]; frac = Math.min(1,Math.max(0,diffDays(prev,t)/diffDays(prev,nf))); }
  const fillPct = !nf ? 75 : idx===0 ? 0 : (idx-1+frac)*25;
  document.getElementById("hero").innerHTML =
    `<div class="big num">${big}</div><div class="lbl">${esc(lbl)}</div>${when?`<div class="when">${esc(when)}</div>`:""}
     <div class="track" aria-label="Festivales: ${done} de ${FESTS.length} hechos">
       <span class="fill" style="width:${fillPct}%"></span>
       ${FESTS.map((f,i)=>`<div class="stop ${f<t?"done":""} ${f===nf?"next":""}"><div class="dot"></div><b>F${i+1}</b>${short(f)}</div>`).join("")}
     </div>`;
}

            <input inputmode="numeric" aria-label="reps serie ${si+1}" data-ex="${ei}" data-set="${si}" data-f="reps" value="${x.reps??""}" placeholder="${ph&&ph.reps!=null?ph.reps:""}">

/* ---------- Peso y pasos ---------- */
function weightChart(){
  const pts = state.body.filter(b=>b.weight!=null).sort((a,b)=>a.date<b.date?-1:1);
  if (pts.length<2) return `<p class="small muted">Con dos registros de peso aparece la gráfica.</p>`;
  const W=640,H=220,P=44; const ws=pts.map(p=>p.weight);
  const min=Math.floor(Math.min(...ws)-1), max=Math.ceil(Math.max(...ws)+1);
  const t0=parse(pts[0].date).getTime(), t1=Math.max(parse(pts[pts.length-1].date).getTime(),t0+86400000);
  const x=d=>P+(parse(d).getTime()-t0)/(t1-t0)*(W-P-10), y=w=>10+(max-w)/(max-min)*(H-P-10);
  const path=pts.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+" "+y(p.weight).toFixed(1)).join(" ");
  const grid=[min,(min+max)/2,max].map(v=>`<line x1="${P}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-8}" y="${y(v)+6}" text-anchor="end">${v.toFixed(0)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso en el tiempo">${grid}
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".28"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
    <path d="${path} L${x(pts[pts.length-1].date).toFixed(1)} ${H-P} L${x(pts[0].date).toFixed(1)} ${H-P} Z" fill="url(#wg)"/>
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.weight)}" r="4.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>`).join("")}
    <text x="${P}" y="${H-8}">${short(pts[0].date)}</text><text x="${W-10}" y="${H-8}" text-anchor="end">${short(pts[pts.length-1].date)}</text></svg>`;
}
function stepsChart(){
  const t=todayISO(); const days=Array.from({length:14},(_,i)=>addDays(t,i-13));
  const map=Object.fromEntries(state.body.filter(b=>b.steps!=null).map(b=>[b.date,b.steps]));
  if (!days.some(d=>map[d]!=null)) return `<p class="small muted">Registra tus pasos para ver las últimas dos semanas.</p>`;
  const W=640,H=180,P=10,top=Math.max(12000,...days.map(d=>map[d]||0));
  const bw=(W-2*P)/14; const y=v=>H-24-(v/top)*(H-40);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pasos de los últimos 14 días">
    <line x1="${P}" x2="${W-P}" y1="${y(10000)}" y2="${y(10000)}" stroke="var(--accent)" stroke-dasharray="5 5"/>
    <text x="${W-P}" y="${y(10000)-5}" text-anchor="end">meta 10.000</text>
    ${days.map((d,i)=>{const v=map[d]; return v!=null?`<rect x="${P+i*bw+4}" y="${y(v)}" width="${bw-8}" height="${H-24-y(v)}" rx="6" fill="${v>=10000?"var(--accent)":"var(--primary)"}" opacity="${v>=10000?1:.75}"/>`:"";}).join("")}
    ${days.map((d,i)=>i%2===1?`<text x="${P+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${parse(d).getDate()}</text>`:"").join("")}
  </svg>`;
}
function renderCuerpo(){

    <div class="stat"><div class="v ${delta!=null&&delta<0?"up":""}">${delta==null?"–":(delta>0?"+":"")+delta.toFixed(1)}</div><div class="k">kg desde el inicio</div></div>
    <div class="stat"><div class="v ${wd!=null&&wd<0?"up":""}">${wd==null?"–":(wd>0?"+":"")+wd.toFixed(1)}</div><div class="k">cm de cintura</div></div>

  ${[...state.body].sort((a,b)=>a.date<b.date?1:-1).map(b=>`<tr><td>${esc(short(b.date))}</td><td class="num">${b.weight??"–"}</td><td class="num">${b.waist??"–"}</td><td class="num">${fmt(b.steps)}</td><td><button class="x" aria-label="Borrar registro" data-delbody="${b.date}">×</button></td></tr>`).join("") || `<tr><td colspan="5" class="muted">Aún no hay registros. Empieza con tu peso de hoy.</td></tr>`}
  </tbody></table></div>`;

/* ---------- Historial ---------- */
function renderHistorial(){
  const sess=[...state.sessions].sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  const t=todayISO(); const since=addDays(t,-6);
  const thisWeek=sess.filter(s=>s.date>=since);
  const strength=thisWeek.filter(s=>ROUTINES[s.type]&&ROUTINES[s.type].kind==="fuerza").length;
  const cardioMin=thisWeek.reduce((a,s)=>a+(s.type!=="fest"?(num(s.cardioMin)||0):0),0);
  // progreso por ejercicio
  const prog={};
  [...sess].reverse().forEach(s=>(s.exercises||[]).forEach(e=>{
    const valid=e.sets.filter(x=>x.kg!=null&&x.reps!=null); if(!valid.length) return;
    const best=valid.reduce((m,x)=>(x.kg>m.kg||(x.kg===m.kg&&x.reps>m.reps))?x:m,valid[0]);
    if(!prog[e.name]) prog[e.name]={first:best,firstDate:s.date};
    prog[e.name].last=best; prog[e.name].lastDate=s.date;
    if(!prog[e.name].top||best.kg>prog[e.name].top.kg) prog[e.name].top=best;
  }));
  const rows=Object.entries(prog).map(([n,p])=>{const up=p.last.kg-p.first.kg;
    return `<tr><td>${esc(n)}</td><td class="num">${p.first.kg}×${p.first.reps}</td><td class="num">${p.last.kg}×${p.last.reps}</td><td class="num ${up>0?"up":""}">${up>0?"+"+up+" kg":"–"}</td></tr>`;}).join("");
  return `
  <div class="stats">
    <div class="stat"><div class="v">${thisWeek.length}</div><div class="k">sesiones, últimos 7 días</div></div>
    <div class="stat"><div class="v">${strength}</div><div class="k">de fuerza</div></div>
    <div class="stat"><div class="v">${cardioMin}</div><div class="k">min de cardio</div></div>
  </div>
  <h2>Progreso por ejercicio</h2>
  ${rows?`<div class="table-wrap"><table><thead><tr><th>Ejercicio</th><th class="num">Inicio</th><th class="num">Ahora</th><th class="num">Subió</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="muted">Cuando guardes tu primera sesión de fuerza, aquí verás cómo sube cada ejercicio.</p>`}
  <h2>Sesiones</h2>
  ${sess.length?sess.map(s=>{const r=ROUTINES[s.type]||{name:s.type};
    const vol=(s.exercises||[]).reduce((a,e)=>a+e.sets.filter(x=>x.kg!=null&&x.reps!=null).length,0);
    return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center">
      <div><span class="pill ${s.type==="fest"?"pink":""}">${esc(r.name)}</span> <span class="small muted">${esc(pretty(s.date))}</span>
      <div class="small muted">${vol?vol+" series":""}${s.cardioMin?(vol?" · ":"")+esc(s.cardioMin)+(s.type==="fest"?" h":" min"):""}${s.walked?" · fue caminando":""}${s.coreDone&&s.coreDone.length?" · core "+s.coreDone.length+"/3":""}</div>
      ${s.notes?`<div class="small">${esc(s.notes)}</div>`:""}</div>
      <div><button class="link" data-open="${esc(s.id)}">Abrir</button> <button class="x" aria-label="Borrar sesión" data-delsess="${esc(s.id)}">×</button></div>
    </div></div>`;}).join(""):`<p class="muted">Todavía no hay sesiones. Guarda la de hoy desde la pestaña Hoy.</p>`}`;
}

/* ---------- Plan ---------- */
function renderPlan(){
  const rows=[["Lunes","Legs + core"],["Martes","Cardio zona 2, 35–45 min"],["Miércoles","Push + core + 15–20 min caminadora inclinada"],["Jueves","Intervalos"],["Viernes","Pull + core + 15–20 min caminadora inclinada"],["Sábado","Caminata larga, 90–120 min"],["Domingo","Descanso"]];
  return `
  <h2>Semana base (desde el 5 de octubre)</h2>
  <div class="table-wrap"><table><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>
  <p class="small muted" style="margin-top:8px">Esta primera semana: mar Push, mié zona 2, jue Pull, vie Legs suave, sáb caminata de 60 min, dom descanso.</p>
  <h2>Ir caminando a Arkadia</h2>
  <ul class="plain">
    <li>Ida y vuelta son ~3,8 km y ~5.000–5.500 pasos: la mitad de la meta diaria.</li>
    <li>Llegas caliente: en el gimnasio basta con 3–5 min de movilidad.</li>
    <li>En Push y Pull mantén los 15–20 min de caminadora inclinada: sube más el pulso que la calle y es lo que construye resistencia.</li>
    <li>En Legs, la vuelta con las piernas cansadas es práctica para el festival.</li>
    <li>Si un día no te da el tiempo, ve a Los Molinos (~32 min ida y vuelta). Ir siempre pesa más que ir lejos.</li>
  </ul>
  <h2>Progresión</h2>
  <ul class="plain">
    <li>Semana 1: 2 series de 10–12, dejando 3–4 repeticiones de sobra.</li>
    <li>Desde la semana 2: 3 series. Con 12 limpias en todas, sube el peso.</li>
    <li>Pasos: suma ~2.000 por semana hasta 10.000–12.000 diarios.</li>
  </ul>
  <h2>Alrededor de cada festival</h2>
  <ul class="plain">
    <li>5–6 días antes: mitad de series, nada al fallo; los intervalos pasan a caminata suave.</li>
    <li>2 días antes: algo ligero y nada de piernas. Día antes: descanso.</li>
    <li>1–2 días después: solo caminar y movilidad. Retoma por Push.</li>
  </ul>
  <h2>Comida</h2>
  <ul class="plain">
    <li>~2.000–2.100 kcal y 130–150 g de proteína al día: proteína en cada comida.</li>
    <li>Plato: mitad verduras, un cuarto proteína, un cuarto carbohidrato. Más carbohidrato los días de entreno.</li>
    <li>Domingo: cocina proteína, arroz y granos para 3–4 días.</li>
  </ul>
  <p class="small muted" style="margin-top:14px">Fechas de festival: ${FESTS.map(short).join(", ")}.</p>
  ${renderDataSection()}`;
}

/* ---------- Render y eventos ---------- */
function render(){
  renderHero();
  const v=document.getElementById("view");
  v.innerHTML = tab==="hoy"?renderHoy():tab==="cuerpo"?renderCuerpo():tab==="historial"?renderHistorial():renderPlan();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab?"true":"false"));
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]"); if(!b) return; tab=b.dataset.tab; render(); window.scrollTo(0,0);});

document.getElementById("view").addEventListener("input",e=>{
  const el=e.target; if(!draft) return;
  if (el.dataset.ex!=null){ const s=draft.exercises[+el.dataset.ex].sets[+el.dataset.set]; s[el.dataset.f]=el.value.trim()===""?null:num(el.value); }
  else if (el.id==="f-cardio") draft.cardioMin=el.value;
  else if (el.id==="f-notes") draft.notes=el.value;
});
document.getElementById("view").addEventListener("change",e=>{
  const el=e.target;
  if (el.id==="f-date"&&el.value){ draft=newDraft(el.value, planFor(el.value).type); render(); }
  else if (el.id==="f-type"){ draft=newDraft(draft.date, el.value); render(); }
  else if (el.id==="f-walked"){ draft.walked=el.checked; render(); }
  else if (el.id==="f-stretch") draft.stretchDone=el.checked;
  else if (el.dataset.core!=null){ const i=+el.dataset.core; draft.coreDone=el.checked?[...new Set([...draft.coreDone,i])]:draft.coreDone.filter(x=>x!==i); }
  else if (el.id==="b-date"){ const b=state.body.find(x=>x.date===el.value)||{};
    ["weight","waist","steps"].forEach(k=>{document.getElementById("b-"+k).value=b[k]??"";}); }
});
document.getElementById("view").addEventListener("click",e=>{
  const el=e.target.closest("button"); if(!el) return;
  if (handleExtraClick(el)) return;
  if (el.dataset.add!=null){ const ex=draft.exercises[+el.dataset.add]; ex.sets.push({kg:null,reps:null}); render(); }
  else if (el.dataset.del){ const [ei,si]=el.dataset.del.split(":").map(Number); const sets=draft.exercises[ei].sets; if(sets.length>1){sets.splice(si,1); render();} }
  else if (el.id==="save-session"){
    const clean=clone(draft);
    state.sessions=state.sessions.filter(s=>s.id!==clean.id); state.sessions.push(clean);
    persist(); toast("Sesión guardada"); render();
  }
  else if (el.id==="save-body"){
    const date=document.getElementById("b-date").value||todayISO();
    const rec={date, weight:num(document.getElementById("b-weight").value), waist:num(document.getElementById("b-waist").value), steps:num(document.getElementById("b-steps").value)};
    if (rec.steps!=null) rec.steps=Math.round(rec.steps);
    if (rec.weight==null&&rec.waist==null&&rec.steps==null){ toast("Escribe al menos un dato"); return; }
    state.body=state.body.filter(b=>b.date!==date); state.body.push(rec);
    persist(); toast("Registro guardado"); render();
  }
  else if (el.dataset.delbody){ if(!confirm("¿Borrar el registro del "+short(el.dataset.delbody)+"?")) return; state.body=state.body.filter(b=>b.date!==el.dataset.delbody); persist(); render(); }
  else if (el.dataset.delsess){ if(!confirm("¿Borrar esta sesión?")) return; state.sessions=state.sessions.filter(s=>s.id!==el.dataset.delsess); persist(); render(); }
  else if (el.dataset.open){ const s=state.sessions.find(x=>x.id===el.dataset.open); if(s){ draft=clone(s); tab="hoy"; render(); window.scrollTo(0,0);} }
});

const local=loadLocal(); if (local) state=normalize(local);
render();
pullRemote();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
